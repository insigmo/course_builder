<body>
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
  <div id="contentWrap"></div>
</main>

<div class="settings-backdrop" id="settingsBackdrop">
  <div class="settings-modal">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="settings-close" id="settingsCloseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-layout">
      <nav class="settings-nav">
        <button class="settings-nav-item active" data-panel="appearance">Appearance</button>
      </nav>
      <div class="settings-panel" id="settingsPanelAppearance">
        <div class="settings-panel-title">Appearance</div>
        <div class="settings-row">
          <label class="settings-field-label" for="themeSelect">Theme</label>
          <div class="settings-select-wrap">
            <select class="settings-select" id="themeSelect">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
              <option value="minecraft">Minecraft</option>
            </select>
            <svg class="settings-select-arrow" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
